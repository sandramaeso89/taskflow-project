openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: API REST de tareas para TaskFlow.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Comprobar estado del backend
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
  /api/v1/tasks:
    get:
      summary: Listar tareas
      responses:
        "200":
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      summary: Crear tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo]
              properties:
                titulo:
                  type: string
                  minLength: 3
      responses:
        "201":
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Error de validacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/tasks/{id}:
    patch:
      summary: Actualizar parcialmente una tarea
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titulo:
                  type: string
                completada:
                  type: boolean
      responses:
        "200":
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Tarea no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Reemplazar tarea completa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, completada]
              properties:
                titulo:
                  type: string
                completada:
                  type: boolean
      responses:
        "200":
          description: Tarea reemplazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Tarea no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Eliminar tarea
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Eliminada sin contenido
        "404":
          description: Tarea no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/tasks/_test/error500:
    get:
      summary: Endpoint de prueba para forzar error 500
      responses:
        "500":
          description: Error interno controlado por middleware global
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        completada:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
